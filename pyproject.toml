[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "diptrace-mcp"
version = "0.2.0"
description = "Model Context Protocol server and live XML bridge for DipTrace"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DipTrace MCP contributors" }]
license = "Apache-2.0"
keywords = ["diptrace", "eda", "mcp", "pcb", "schematic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "mcp>=1.28.1,<2",
  "pydantic>=2.11,<3",
  "tomli>=2.0,<3; python_version < '3.11'",
  "typing-extensions>=4.12,<5",
]

[project.urls]
Homepage = "https://github.com/fireostendere/mcp_diptrace"
Documentation = "https://github.com/fireostendere/mcp_diptrace#documentation"
Issues = "https://github.com/fireostendere/mcp_diptrace/issues"
Repository = "https://github.com/fireostendere/mcp_diptrace"

[project.optional-dependencies]
geometry = [
  "shapely>=2.0,<3",
]
dev = [
  "hatchling>=1.27,<2",
  "hypothesis>=6.135,<7",
  "jsonschema>=4.24,<5",
  "mypy>=1.16,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "PyYAML>=6.0,<7",
  "ruff>=0.12,<1",
  "tomli>=2.0,<3",
]
bridge = [
  "pyinstaller==6.14.2",
]

[project.scripts]
diptrace-mcp = "diptrace_mcp.server:main"
diptrace-mcp-bridge = "diptrace_mcp.bridge:main"
diptrace-mcp-configure = "diptrace_mcp.windows_configurator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diptrace_mcp"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["plugin/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["diptrace_mcp"]
known-third-party = ["mcp", "pydantic", "pytest"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["diptrace_mcp"]
exclude = ["^plugin/dist/"]
warn_unreachable = true
