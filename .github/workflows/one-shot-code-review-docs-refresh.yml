name: One-shot code review docs refresh

on:
  push:
    branches:
      - agent/code-review-docs-refresh
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/code-review-docs-refresh')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/code-review-docs-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply reviewed documentation and regression updates
        run: python scripts/one_shot_code_review_docs_refresh.py
      - name: Install development and geometry dependencies
        run: python -m pip install -e ".[dev,geometry]"
      - name: Run focused path regressions
        run: python -m pytest -q tests/test_cross_platform_exchange_paths.py
      - name: Run full tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check --no-cache src tests benchmarks scripts plugin
      - name: Run strict Mypy
        run: python -m mypy --no-incremental src/diptrace_mcp plugin
      - name: Verify generated skills and tool contract
        run: |
          python scripts/generate_pcb_skills.py --check
          python scripts/generate_mcp_tools_snapshot.py --check
      - name: Build and audit release artifacts
        run: |
          python -m hatchling build -d release-dist
          python scripts/audit_release_artifacts.py --dist-dir release-dist --check-allowlist
      - name: Commit final reviewed tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: refresh review and live acceptance status"
          git push origin HEAD:agent/code-review-docs-refresh
