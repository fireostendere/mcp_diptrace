name: One-shot release 0.1.1

on:
  push:
    branches:
      - agent/release-0.1.1

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  prepare-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: agent/release-0.1.1
      RELEASE_VERSION: 0.1.1
      RELEASE_TAG: v0.1.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/release-0.1.1
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Refuse an existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

      - name: Prepare final release tree and remove one-shot automation
        run: python scripts/one_shot_prepare_release_0_1_1.py

      - name: Install development and geometry dependencies
        run: python -m pip install -e ".[dev,geometry]"

      - name: Run release quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check --no-cache src tests benchmarks scripts plugin
          python -m mypy --no-incremental src/diptrace_mcp plugin
          python scripts/generate_pcb_skills.py --check
          python scripts/generate_mcp_tools_snapshot.py --check
          python scripts/verify_geometry_backend.py --expect shapely_geos
          python scripts/smoke_bridge_headless.py
          python -m pytest -q \
            --cov=src/diptrace_mcp \
            --cov-report=term \
            --cov-report=json:"${RUNNER_TEMP}/coverage.json" \
            --cov-fail-under=85
          python scripts/check_coverage.py "${RUNNER_TEMP}/coverage.json"
          python scripts/measure_mcp_surface.py --baseline-bytes 121335 --max-growth-percent 15
          python scripts/extract_spec_inventory.py \
            --sources reference/diptrace-xml/extracted_text \
            --out reference/diptrace-xml/spec_inventory.json \
            --check
          python scripts/report_format_coverage.py --check
          python scripts/make_probe_pack.py --check
          python scripts/ingest_fixtures.py --dry-run --synthetic --json
          python scripts/audit_acceptance_seeds.py
          python scripts/mcp_smoke.py --transport stdio > "${RUNNER_TEMP}/source-stdio-smoke.json"

      - name: Build and audit candidate Python artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/candidate-dist"
          python -m hatchling build -d "${RUNNER_TEMP}/candidate-dist"
          python scripts/audit_release_artifacts.py \
            --dist-dir "${RUNNER_TEMP}/candidate-dist" \
            --check-allowlist
          test -f "${RUNNER_TEMP}/candidate-dist/diptrace_mcp-${RELEASE_VERSION}.tar.gz"
          test -f "${RUNNER_TEMP}/candidate-dist/diptrace_mcp-${RELEASE_VERSION}-py3-none-any.whl"

      - name: Commit final release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare release 0.1.1"
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${RELEASE_BRANCH}"
          echo "sha=${FINAL_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Wait for connector-created release pull request
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=""
          for _ in $(seq 1 180); do
            PR_NUMBER="$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${RELEASE_BRANCH}" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number // empty')"
            if [[ -n "${PR_NUMBER}" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "Timed out waiting for release PR" >&2
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the complete PR CI matrix
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          for _ in $(seq 1 120); do
            COUNT="$(gh pr view "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json statusCheckRollup \
              --jq '.statusCheckRollup | length')"
            if [[ "${COUNT}" -gt 0 ]]; then
              break
            fi
            sleep 10
          done
          gh pr checks "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --watch \
            --fail-fast \
            --interval 10

      - name: Resolve successful CI run and download Windows bridge
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          FINAL_SHA="${{ steps.candidate.outputs.sha }}"
          RUN_ID="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow CI \
            --event pull_request \
            --branch "${RELEASE_BRANCH}" \
            --limit 30 \
            --json databaseId,headSha,status,conclusion \
            --jq ".[] | select(.headSha == \"${FINAL_SHA}\" and .status == \"completed\" and .conclusion == \"success\") | .databaseId" \
            | head -n 1)"
          if [[ -z "${RUN_ID}" ]]; then
            echo "Could not find successful CI run for ${FINAL_SHA}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/windows-bridge"
          gh run download "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name diptrace-bridge-ci-unsigned \
            --dir "${RUNNER_TEMP}/windows-bridge"
          BRIDGE="$(find "${RUNNER_TEMP}/windows-bridge" -type f -name diptrace_mcp_bridge.exe -print -quit)"
          test -n "${BRIDGE}"
          test -s "${BRIDGE}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "bridge=${BRIDGE}" >> "${GITHUB_OUTPUT}"

      - name: Squash-merge the release candidate
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --subject "Release 0.1.1" \
            --body "Prepare version 0.1.1, freeze release metadata, and publish the verified Windows/WSL bridge fixes and acceptance documentation."
          MERGE_SHA="$(gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json mergeCommit \
            --jq '.mergeCommit.oid')"
          test -n "${MERGE_SHA}"
          echo "sha=${MERGE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the exact frozen merge commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout --detach "${{ steps.merge.outputs.sha }}"
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${RELEASE_VERSION}"

      - name: Build, audit, rebuild-compare, and smoke-test frozen Python artifacts
        shell: bash
        run: |
          set -euo pipefail
          DIST="${RUNNER_TEMP}/release-dist"
          REBUILT="${RUNNER_TEMP}/rebuilt-dist"
          EXTRACTED="${RUNNER_TEMP}/sdist-extracted"
          SMOKE="${RUNNER_TEMP}/release-smoke"
          mkdir -p "${DIST}" "${REBUILT}" "${EXTRACTED}"

          python -m hatchling build -d "${DIST}"
          python scripts/audit_release_artifacts.py --dist-dir "${DIST}" --check-allowlist

          SDIST="${DIST}/diptrace_mcp-${RELEASE_VERSION}.tar.gz"
          WHEEL="${DIST}/diptrace_mcp-${RELEASE_VERSION}-py3-none-any.whl"
          test -s "${SDIST}"
          test -s "${WHEEL}"

          tar -xzf "${SDIST}" -C "${EXTRACTED}"
          SDIST_ROOT="$(find "${EXTRACTED}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "${SDIST_ROOT}"
          (
            cd "${SDIST_ROOT}"
            python -m hatchling build -t wheel -d "${REBUILT}"
          )
          REBUILT_WHEEL="$(find "${REBUILT}" -type f -name '*.whl' -print -quit)"
          test -n "${REBUILT_WHEEL}"

          DIRECT_WHEEL="${WHEEL}" REBUILT_WHEEL="${REBUILT_WHEEL}" python - <<'PY'
          import hashlib
          import os
          import zipfile

          def members(path: str) -> dict[str, str]:
              with zipfile.ZipFile(path) as archive:
                  return {
                      name: hashlib.sha256(archive.read(name)).hexdigest()
                      for name in sorted(archive.namelist())
                  }

          direct = members(os.environ["DIRECT_WHEEL"])
          rebuilt = members(os.environ["REBUILT_WHEEL"])
          if direct != rebuilt:
              missing = sorted(set(direct) - set(rebuilt))
              extra = sorted(set(rebuilt) - set(direct))
              changed = sorted(
                  name for name in set(direct) & set(rebuilt) if direct[name] != rebuilt[name]
              )
              raise SystemExit(
                  f"wheel rebuild mismatch: missing={missing}, extra={extra}, changed={changed}"
              )
          print(f"wheel rebuild comparison passed: {len(direct)} members")
          PY

          python -m venv "${SMOKE}"
          "${SMOKE}/bin/python" -m pip install --upgrade pip
          "${SMOKE}/bin/pip" install "${WHEEL}"
          "${SMOKE}/bin/diptrace-mcp" --help
          "${SMOKE}/bin/python" scripts/mcp_smoke.py \
            --transport stdio \
            --workspace tests/fixtures \
            --document pcb.xml \
            > "${RUNNER_TEMP}/wheel-stdio-smoke.json"
          SMOKE_JSON="${RUNNER_TEMP}/wheel-stdio-smoke.json" python - <<'PY'
          import json
          import os

          payload = json.load(open(os.environ["SMOKE_JSON"], encoding="utf-8"))
          if payload.get("tool_count") != 159:
              raise SystemExit(f"unexpected wheel tool count: {payload.get('tool_count')}")
          print("clean-wheel stdio smoke passed: 159 tools")
          PY

      - name: Assemble immutable release assets and checksums
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          DIST="${RUNNER_TEMP}/release-dist"
          BRIDGE="${{ steps.ci.outputs.bridge }}"
          PACKAGE="${RUNNER_TEMP}/windows-plugin-package"

          cp "${BRIDGE}" "${DIST}/diptrace_mcp_bridge.exe"
          cp docs/LIVE_ACCEPTANCE_2026-07-31.md "${DIST}/LIVE_ACCEPTANCE_2026-07-31.md"
          cp docs/CODE_REVIEW_2026-07-31.md "${DIST}/CODE_REVIEW_2026-07-31.md"

          mkdir -p "${PACKAGE}/settings"
          cp "${BRIDGE}" "${PACKAGE}/diptrace_mcp_bridge.exe"
          cp plugin/install_plugin.ps1 "${PACKAGE}/install_plugin.ps1"
          cp plugin/settings/*.xml "${PACKAGE}/settings/"
          cp LICENSE "${PACKAGE}/LICENSE"
          cp docs/LIVE_EXCHANGE_PATHS.md "${PACKAGE}/LIVE_EXCHANGE_PATHS.md"
          (
            cd "${PACKAGE}"
            zip -q -r "${DIST}/diptrace_mcp_windows_plugin-${RELEASE_VERSION}.zip" .
          )

          (
            cd "${DIST}"
            sha256sum \
              "diptrace_mcp-${RELEASE_VERSION}.tar.gz" \
              "diptrace_mcp-${RELEASE_VERSION}-py3-none-any.whl" \
              diptrace_mcp_bridge.exe \
              "diptrace_mcp_windows_plugin-${RELEASE_VERSION}.zip" \
              LIVE_ACCEPTANCE_2026-07-31.md \
              CODE_REVIEW_2026-07-31.md \
              > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          echo "dir=${DIST}" >> "${GITHUB_OUTPUT}"

      - name: Create annotated tag and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          MERGE_SHA="${{ steps.merge.outputs.sha }}"
          CI_RUN_ID="${{ steps.ci.outputs.run_id }}"
          DIST="${{ steps.assets.outputs.dir }}"
          NOTES="${RUNNER_TEMP}/release-notes.md"

          git config user.name "fireostendere"
          git config user.email "87851878+fireostendere@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${MERGE_SHA}" -m "DipTrace MCP ${RELEASE_VERSION}"
          git push origin "${RELEASE_TAG}"

          {
            echo "# DipTrace MCP ${RELEASE_VERSION}"
            echo
            echo "Frozen commit: \`${MERGE_SHA}\`."
            echo "Required pull-request CI: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}"
            echo
            cat "docs/releases/v${RELEASE_VERSION}.md"
          } > "${NOTES}"

          PRERELEASE_ARGS=()
          if gh release view v0.1.0 --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq '.isPrerelease' 2>/dev/null | grep -qx true; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "DipTrace MCP ${RELEASE_VERSION}" \
            --notes-file "${NOTES}" \
            "${PRERELEASE_ARGS[@]}" \
            "${DIST}/diptrace_mcp-${RELEASE_VERSION}.tar.gz" \
            "${DIST}/diptrace_mcp-${RELEASE_VERSION}-py3-none-any.whl" \
            "${DIST}/diptrace_mcp_bridge.exe" \
            "${DIST}/diptrace_mcp_windows_plugin-${RELEASE_VERSION}.zip" \
            "${DIST}/LIVE_ACCEPTANCE_2026-07-31.md" \
            "${DIST}/CODE_REVIEW_2026-07-31.md" \
            "${DIST}/SHA256SUMS.txt"

          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,isDraft,isPrerelease,url,assets

      - name: Delete the temporary release branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${RELEASE_BRANCH}" \
            >/dev/null 2>&1 || true
