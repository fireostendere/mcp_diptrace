name: Package clearance report fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply-verify-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply focused source and test changes
        run: python scripts/_apply_clearance_report_fix.py
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,geometry]"
      - name: Format and lint modified files
        run: |
          python -m ruff format src/diptrace_mcp/review.py tests/test_review.py
          python -m ruff check --fix src/diptrace_mcp/review.py tests/test_review.py
          python -m ruff check src/diptrace_mcp/review.py tests/test_review.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_review.py tests/test_clearance_resolution.py
      - name: Run strict typing
        run: python -m mypy --no-incremental src/diptrace_mcp
      - name: Package verified files
        run: |
          mkdir -p packaged/src/diptrace_mcp packaged/tests packaged/docs
          cp src/diptrace_mcp/review.py packaged/src/diptrace_mcp/review.py
          cp tests/test_review.py packaged/tests/test_review.py
          cp docs/REVIEW_ENGINE.md packaged/docs/REVIEW_ENGINE.md
          cp CHANGELOG.md packaged/CHANGELOG.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clearance-report-fix
          path: packaged
          retention-days: 1
