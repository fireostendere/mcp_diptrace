name: One-shot clearance report fix

on:
  push:
    branches:
      - fix/bound-clearance-partial-report

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[one-shot applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: fix/bound-clearance-partial-report
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply focused source and test changes
        run: python scripts/_apply_clearance_report_fix.py
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,geometry]"
      - name: Format and lint modified files
        run: |
          python -m ruff format src/diptrace_mcp/review.py tests/test_review.py
          python -m ruff check --fix src/diptrace_mcp/review.py tests/test_review.py
          python -m ruff check src/diptrace_mcp/review.py tests/test_review.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_review.py tests/test_clearance_resolution.py
      - name: Run strict typing
        run: python -m mypy --no-incremental src/diptrace_mcp
      - name: Commit verified fix and remove one-shot machinery
        env:
          TARGET_BRANCH: fix/bound-clearance-partial-report
        run: |
          git config user.name "fireostendere"
          git config user.email "87851878+fireostendere@users.noreply.github.com"
          git rm scripts/_apply_clearance_report_fix.py .github/workflows/one-shot-clearance-report-fix.yml
          git add src/diptrace_mcp/review.py tests/test_review.py docs/REVIEW_ENGINE.md CHANGELOG.md
          git commit -s -m "fix: bound partial clearance review output [one-shot applied]"
          git push origin "HEAD:${TARGET_BRANCH}"
