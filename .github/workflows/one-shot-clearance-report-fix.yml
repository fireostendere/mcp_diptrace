name: Finalize clearance report fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: fix/bound-clearance-partial-report
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply focused source and test changes
        run: |
          python scripts/_apply_clearance_report_fix.py
          python scripts/_adjust_clearance_test_semantics.py
          python scripts/_adjust_clearance_typing.py
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,geometry]"
      - name: Format and lint modified files
        run: |
          python -m ruff format src/diptrace_mcp/review.py tests/test_review.py
          python -m ruff check --fix src/diptrace_mcp/review.py tests/test_review.py
          python -m ruff check src/diptrace_mcp/review.py tests/test_review.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_review.py tests/test_clearance_resolution.py
      - name: Run strict typing
        run: python -m mypy --no-incremental src/diptrace_mcp
      - name: Commit verified source and remove temporary machinery
        env:
          TARGET_BRANCH: fix/bound-clearance-partial-report
        run: |
          git config user.name "fireostendere"
          git config user.email "87851878+fireostendere@users.noreply.github.com"
          git rm \
            .github/workflows/one-shot-clearance-report-fix.yml \
            scripts/_apply_clearance_report_fix.py \
            scripts/_adjust_clearance_test_semantics.py \
            scripts/_adjust_clearance_typing.py
          git add \
            src/diptrace_mcp/review.py \
            tests/test_review.py \
            docs/REVIEW_ENGINE.md \
            CHANGELOG.md
          git commit -s -m "fix: bound partial clearance review output"
          git push origin "HEAD:${TARGET_BRANCH}"
