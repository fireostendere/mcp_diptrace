name: PyPI release

on:
  pull_request:
    paths:
      - ".github/workflows/pypi.yml"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "src/diptrace_mcp/**"
      - "scripts/audit_release_artifacts.py"
      - "scripts/hatch_build.py"
      - "scripts/release_artifact_allowlist.txt"
      - "tests/test_ci_workflow.py"
      - "tests/test_release_artifacts.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pypi.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the exact annotated v0.2.1 tag to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_VERSION: "0.2.1"
  RELEASE_TAG: "v0.2.1"

jobs:
  build:
    name: Build and validate PyPI distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release validation environment
        run: python -m pip install -e ".[dev]" "twine>=6,<8"
      - name: Verify release identity and publication ref
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          actual = data["project"]["version"]
          expected = "0.2.1"
          if actual != expected:
              raise SystemExit(f"project version {actual!r} does not match {expected!r}")
          PY

          if [[ "${PUBLISH_REQUESTED}" == "true" ]]; then
            if [[ "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]]; then
              echo "Publication requires dispatching this workflow from ${RELEASE_TAG}." >&2
              exit 1
            fi
            git fetch --tags --force
            if [[ "$(git cat-file -t "${RELEASE_TAG}")" != "tag" ]]; then
              echo "${RELEASE_TAG} must be an annotated tag." >&2
              exit 1
            fi
            if [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" != "${GITHUB_SHA}" ]]; then
              echo "Workflow SHA does not match the annotated tag target." >&2
              exit 1
            fi
          fi
      - name: Build and audit distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python -m hatchling build -d dist
          python scripts/audit_release_artifacts.py --dist-dir dist --check-allowlist
          python -m twine check --strict dist/*
          test -f "dist/diptrace_mcp-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "dist/diptrace_mcp-${RELEASE_VERSION}.tar.gz"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Smoke wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install "dist/diptrace_mcp-${RELEASE_VERSION}-py3-none-any.whl"
          wheel-venv/bin/diptrace-mcp --help
          wheel-venv/bin/python -c "import diptrace_mcp; assert diptrace_mcp.__version__ == '${RELEASE_VERSION}'"

          python -m venv sdist-venv
          sdist-venv/bin/python -m pip install "dist/diptrace_mcp-${RELEASE_VERSION}.tar.gz"
          sdist-venv/bin/diptrace-mcp --help
          sdist-venv/bin/python -c "import diptrace_mcp; assert diptrace_mcp.__version__ == '${RELEASE_VERSION}'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: |
            dist/diptrace_mcp-0.2.1-py3-none-any.whl
            dist/diptrace_mcp-0.2.1.tar.gz
          if-no-files-found: error

  publish:
    name: Publish v0.2.1 to PyPI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/diptrace-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist

  github-release:
    name: Create verified v0.2.1 GitHub prerelease
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_COMMIT: 1d2b7bef256cd43262b566dc2cd4050248d0145d
      WINDOWS_ARTIFACT_ID: "8924092979"
      MCPB_ARTIFACT_ID: "8924053653"
      PYPI_ARTIFACT_ID: "8924043085"
      WINDOWS_RUN_ID: "30990831129"
      MCPB_RUN_ID: "30990857901"
      PYPI_RUN_ID: "30990871942"
    steps:
      - name: Download validated release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/unpack/windows work/unpack/mcpb work/unpack/pypi work/assets
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${WINDOWS_ARTIFACT_ID}/zip" > work/windows.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${MCPB_ARTIFACT_ID}/zip" > work/mcpb.zip
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PYPI_ARTIFACT_ID}/zip" > work/pypi.zip
          unzip -q work/windows.zip -d work/unpack/windows
          unzip -q work/mcpb.zip -d work/unpack/mcpb
          unzip -q work/pypi.zip -d work/unpack/pypi

          cp work/unpack/windows/installer/DipTrace-MCP-Setup-0.2.1.exe work/assets/
          cp work/unpack/windows/portable/DipTrace-MCP-Portable-0.2.1.zip work/assets/
          cp work/unpack/mcpb/DipTrace-MCP-0.2.1-windows.mcpb work/assets/
          cp work/unpack/pypi/diptrace_mcp-0.2.1-py3-none-any.whl work/assets/
          cp work/unpack/pypi/diptrace_mcp-0.2.1.tar.gz work/assets/

      - name: Verify immutable release identities
        shell: bash
        run: |
          set -euo pipefail
          cd work/assets
          cat > SHA256SUMS.txt <<'EOF'
          4377d3980f7b065927c4d2a6bec5894a35d9c58ca6b14d04850306b2fc40a8e5  DipTrace-MCP-Setup-0.2.1.exe
          1a88daaf530987e8358459edfbd77e37aed1f6f6895ddddd4968fb39c47a5a37  DipTrace-MCP-Portable-0.2.1.zip
          b2651b453d40a31d7c1cb91299e9e61bce49754e9649dbfa5e44cffd0fba34e5  DipTrace-MCP-0.2.1-windows.mcpb
          325ad8b032f1014d61a5b38e2cc2af3f97105c73246edad06ca1739704e872ea  diptrace_mcp-0.2.1-py3-none-any.whl
          39cc2658ca0888cc52ef583c0f6940831afc7b3af2472397001cf4e3bc5a29e0  diptrace_mcp-0.2.1.tar.gz
          EOF
          sed -i 's/^          //' SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

          cat > RELEASE_PROVENANCE.txt <<EOF
          DipTrace MCP v0.2.1 release provenance
          Tag: ${RELEASE_TAG}
          Tag target: ${RELEASE_COMMIT}
          Windows workflow run: ${WINDOWS_RUN_ID}
          Windows artifact: ${WINDOWS_ARTIFACT_ID}
          MCPB workflow run: ${MCPB_RUN_ID}
          MCPB artifact: ${MCPB_ARTIFACT_ID}
          PyPI validation workflow run: ${PYPI_RUN_ID}
          PyPI artifact: ${PYPI_ARTIFACT_ID}
          Artifacts are unsigned development/prerelease builds.
          EOF
          sed -i 's/^          //' RELEASE_PROVENANCE.txt

      - name: Create public prerelease with assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.type)"
          test "${tag_type}" = "tag"
          peeled_target="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq .object.sha)"
          test "${peeled_target}" = "${RELEASE_COMMIT}"

          cat > work/release-notes.md <<'EOF'
          DipTrace MCP 0.2.1 is an unsigned development prerelease focused on distribution and installation.

          Highlights:
          - installable Python package with `pip install diptrace-mcp==0.2.1` after PyPI publication;
          - validated wheel and source distribution;
          - Windows one-click installer and portable archive;
          - Windows MCPB candidate;
          - deterministic SHA-256 identities for every attached release asset;
          - manual, annotated-tag-bound PyPI Trusted Publishing through GitHub OIDC.

          Important boundaries:
          - Windows executables are unsigned;
          - the Python package installs the MCP server but does not automatically install the DipTrace bridge plug-in;
          - production readiness and universal DipTrace 5.x compatibility are not claimed;
          - Novarm/DipTrace endorsement or affiliation is not claimed.

          Validated source commit: `1d2b7bef256cd43262b566dc2cd4050248d0145d`.

          Successful release workflows:
          - Windows one-click installer: run `30990831129`;
          - MCPB and registry preparation: run `30990857901`;
          - PyPI distribution validation: run `30990871942`.

          Verify downloaded files with the attached `SHA256SUMS.txt` before use.
          EOF
          sed -i 's/^          //' work/release-notes.md

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "DipTrace MCP v0.2.1" \
            --notes-file work/release-notes.md \
            work/assets/DipTrace-MCP-Setup-0.2.1.exe \
            work/assets/DipTrace-MCP-Portable-0.2.1.zip \
            work/assets/DipTrace-MCP-0.2.1-windows.mcpb \
            work/assets/diptrace_mcp-0.2.1-py3-none-any.whl \
            work/assets/diptrace_mcp-0.2.1.tar.gz \
            work/assets/SHA256SUMS.txt \
            work/assets/RELEASE_PROVENANCE.txt

          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json url,tagName,name,isDraft,isPrerelease,assets
