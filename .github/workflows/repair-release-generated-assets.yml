name: Repair generated release assets

on:
  pull_request:
    types: [reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/release-0.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/release-0.1.1
          fetch-depth: 0

      - name: Refresh generated skill hashes during release preparation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/one_shot_prepare_release_0_1_1.py")
          content = path.read_text(encoding="utf-8")
          anchor = '''subprocess.run(["git", "rm", "--", str(SELF), str(WORKFLOW)], cwd=ROOT, check=True)
          subprocess.run(
              ["python", "scripts/audit_release_artifacts.py", "--write-allowlist"],
              cwd=ROOT,
              check=True,
          )'''
          replacement = '''subprocess.run(["git", "rm", "--", str(SELF), str(WORKFLOW)], cwd=ROOT, check=True)
          subprocess.run(
              ["python", "scripts/generate_pcb_skills.py"],
              cwd=ROOT,
              check=True,
          )
          subprocess.run(["git", "add", "skills"], cwd=ROOT, check=True)
          subprocess.run(
              ["python", "scripts/audit_release_artifacts.py", "--write-allowlist"],
              cwd=ROOT,
              check=True,
          )'''
          if content.count(anchor) != 1:
              raise SystemExit(f"unexpected release-prep anchor count: {content.count(anchor)}")
          path.write_text(content.replace(anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Commit repaired generator sequence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --force .github/workflows/repair-release-generated-assets.yml
          git add scripts/one_shot_prepare_release_0_1_1.py
          git diff --cached --check
          git commit -m "Refresh generated release metadata before validation"
          git push origin HEAD:agent/release-0.1.1
