name: Post-release documentation sync temp

on:
  push:
    branches:
      - agent/post-release-hardening
    paths:
      - .github/workflows/post-release-doc-sync-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/post-release-hardening
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Synchronize published release documentation and drift tests
        run: python scripts/post_release_sync_temp.py
      - name: Validate synchronized state
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python scripts/check_release_metadata.py
          python scripts/check_documentation_state.py
          python -m pytest -q tests/test_ci_workflow.py tests/test_documentation_state.py
          git diff --check
      - name: Commit synchronized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name fireostendere
          git config user.email 87851878+fireostendere@users.noreply.github.com
          git add README.md CHANGELOG.md CHANGELOG_NEXT.md docs scripts/check_documentation_state.py scripts/release_artifact_allowlist.txt tests/test_ci_workflow.py
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Synchronize v0.4.0 published state" -m "Signed-off-by: fireostendere <87851878+fireostendere@users.noreply.github.com>"
          git push origin HEAD:agent/post-release-hardening
