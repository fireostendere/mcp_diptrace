name: One-shot event-loop and badges integration

on:
  push:
    branches:
      - perf/event-loop-responsiveness-badges
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ !contains(github.event.head_commit.message || github.event.pull_request.title, '[event-loop-badges-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: perf/event-loop-responsiveness-badges
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply deterministic integration updates
        run: |
          python scripts/_apply_event_loop_badge_updates.py
          python scripts/_apply_event_loop_offload.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,geometry]"
      - name: Format and lint changed Python
        run: |
          python -m ruff format \
            src/diptrace_mcp/error_boundary.py \
            src/diptrace_mcp/server.py \
            scripts/audit_event_loop.py \
            scripts/generate_coverage_badge.py \
            tests/test_badges.py \
            tests/test_error_boundary.py \
            tests/test_event_loop_responsiveness.py
          python -m ruff check --fix \
            src/diptrace_mcp/error_boundary.py \
            src/diptrace_mcp/server.py \
            scripts/audit_event_loop.py \
            scripts/generate_coverage_badge.py \
            tests/test_badges.py \
            tests/test_error_boundary.py \
            tests/test_event_loop_responsiveness.py
          python -m ruff check --no-cache src tests benchmarks scripts plugin
      - name: Verify event-loop contract
        run: |
          python scripts/audit_event_loop.py --json
          python -m pytest -q \
            tests/test_event_loop_responsiveness.py \
            tests/test_error_boundary.py \
            tests/test_error_contract.py
      - name: Verify badges and documentation
        run: |
          python scripts/generate_coverage_badge.py --check
          python -m pytest -q \
            tests/test_badges.py \
            tests/test_ci_workflow.py \
            tests/test_documentation_links.py \
            tests/test_release_artifacts.py
      - name: Verify generated and compliance surfaces
        run: |
          python scripts/generate_compliance_inventory.py --check
          python scripts/check_provenance_inventory.py
          python scripts/check_public_privacy.py
          python -m mypy --no-incremental src/diptrace_mcp plugin
      - name: Commit verified integration and remove one-shot machinery
        env:
          TARGET_BRANCH: perf/event-loop-responsiveness-badges
        run: |
          git config user.name "fireostendere"
          git config user.email "87851878+fireostendere@users.noreply.github.com"
          git rm \
            .github/workflows/one-shot-event-loop-badges.yml \
            scripts/_apply_event_loop_badge_updates.py \
            scripts/_apply_event_loop_offload.py
          git add \
            .github/workflows/ci.yml \
            CHANGELOG.md \
            README.md \
            README_RU.md \
            docs/ASYNC_EXECUTION.md \
            docs/TESTING.md \
            docs/badges/coverage.svg \
            scripts/audit_event_loop.py \
            scripts/generate_coverage_badge.py \
            scripts/release_artifact_allowlist.txt \
            src/diptrace_mcp/error_boundary.py \
            src/diptrace_mcp/server.py \
            tests/test_badges.py \
            tests/test_error_boundary.py \
            tests/test_event_loop_responsiveness.py
          git commit -s -m "fix: offload FastMCP tools and publish verified badges [event-loop-badges-applied]"
          git push origin "HEAD:${TARGET_BRANCH}"
