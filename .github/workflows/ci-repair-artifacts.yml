name: CI Repair Artifacts

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-python-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/generate_mcp_tools_snapshot.py --out generated-3.13.json
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-tools-python-313
          path: generated-3.13.json
