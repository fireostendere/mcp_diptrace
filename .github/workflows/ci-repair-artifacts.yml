name: CI Repair Artifacts

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/generate_pcb_skills.py
      - run: python scripts/generate_mcp_tools_snapshot.py
      - name: Commit generated repair artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/SOURCES.sha256 reference/mcp-tools-list.snapshot.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh generated CI artifacts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
