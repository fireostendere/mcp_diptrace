name: CI Helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-headless-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-green-clean
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Avoid modal dialogs in headless mode
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/diptrace_mcp/bridge.py")
          text = path.read_text(encoding="utf-8")
          old = "        _show_fatal(str(exc))\n"
          new = (
              "        if args.headless:\n"
              "            print(str(exc), file=sys.stderr)\n"
              "        else:\n"
              "            _show_fatal(str(exc))\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one fatal call, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          '@ | python -
      - run: python -m ruff check --no-cache src/diptrace_mcp/bridge.py
      - run: python -m mypy --no-incremental src/diptrace_mcp/bridge.py
      - run: python -m pytest -q tests/test_bridge.py
      - name: Commit focused Windows fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/diptrace_mcp/bridge.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: keep headless bridge errors non-interactive"
            git push origin HEAD:fix/ci-green-clean
          }
