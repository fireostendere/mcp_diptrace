name: CI Helper

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-clean-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-green-clean
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Wrap deterministic description within lint limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/diptrace_mcp/server.py")
          text = path.read_text(encoding="utf-8")
          old = '            "Validate distinct allowed-root evidence roles and exact SHA bindings without writing.\\n\\n"'
          new = (
              '            "Validate distinct allowed-root evidence roles and exact SHA bindings "\n'
              '            "without writing.\\n\\n"'
          )
          if text.count(old) != 1:
              raise SystemExit("expected exactly one long deterministic description")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
      - run: python -m ruff check --no-cache src/diptrace_mcp/server.py
      - run: python scripts/generate_mcp_tools_snapshot.py --check
      - run: python scripts/generate_pcb_skills.py --check
      - name: Commit focused lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/diptrace_mcp/server.py
          git commit -m "fix: wrap deterministic tool description"
          git push origin HEAD:fix/ci-green-clean
