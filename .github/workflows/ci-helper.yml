name: CI Helper

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ci-green-clean
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" pytest-timeout
      - name: Run verbose Windows suite with per-test timeout
        run: python -m pytest -vv --tb=short --timeout=30 --timeout-method=thread
