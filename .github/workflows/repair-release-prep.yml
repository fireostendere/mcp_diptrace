name: Repair release preparation

on:
  pull_request:
    types: [reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/release-0.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/release-0.1.1
          fetch-depth: 0

      - name: Replace brittle Russian README anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/one_shot_prepare_release_0_1_1.py")
          content = path.read_text(encoding="utf-8")
          start = content.index('replace_once(\n    "README_RU.md",')
          end = content.index('\n\nreplace_once(\n    "docs/RELEASE_PROCESS.md",', start)
          replacement = '''replace_once(
              "README_RU.md",
              "Текущий релиз — версия 0.1.0.",
              "Текущий development-stage релиз — версия 0.1.1.",
          )
          replace_once(
              "README_RU.md",
              "Tag `v0.1.0`",
              "Tag `v0.1.1`",
          )
          replace_once(
              "README_RU.md",
              "[docs/releases/v0.1.0.md](docs/releases/v0.1.0.md)",
              "[docs/releases/v0.1.1.md](docs/releases/v0.1.1.md)",
          )'''
          path.write_text(content[:start] + replacement + content[end:], encoding="utf-8")
          PY

      - name: Commit repaired one-shot script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --force .github/workflows/repair-release-prep.yml scripts/sitecustomize.py
          git add scripts/one_shot_prepare_release_0_1_1.py
          git diff --cached --check
          git commit -m "Repair 0.1.1 release preparation"
          git push origin HEAD:agent/release-0.1.1
