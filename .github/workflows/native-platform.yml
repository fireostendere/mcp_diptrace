name: Native PCB platform acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/native-platform.yml'
      - 'src/diptrace_mcp/native_cad.py'
      - 'src/diptrace_mcp/headless_gui.py'
      - 'src/diptrace_mcp/pcb_native_acceptance.py'
      - 'src/diptrace_mcp/schematic_native_acceptance.py'
      - 'src/diptrace_mcp/native_xml_export.py'
      - 'src/diptrace_mcp/cinematic_recording.py'
      - 'scripts/validate_native_platform.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned test-only DipTrace Freeware
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dipfree.exe'
          curl.exe --fail --location --retry 3 --max-time 180 https://diptrace.com/downloads/dipfree_en64.exe --output $installer
          if ($LASTEXITCODE -ne 0) { throw 'DipTrace download failed' }
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          # DipTrace 5.3.5.1; Authenticode: NOVARM LIMITED via GlobalSign EV CodeSigning (verified 2026-10-08).
          if ($actual -ne '8845d6e6e72f9671ea270ac462bd25c0c7794f68a7f4015b88aece980bfb848c') { throw "Pinned DipTrace installer mismatch: $actual" }
          $process = Start-Process $installer -ArgumentList '/silent','/hide' -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Installer timeout' }
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $root = 'C:\Program Files\DipTrace'
          if (-not (Test-Path "$root\Pcb.exe")) { throw 'DipTrace Pcb.exe is missing' }
          "DIPTRACE_ROOT=$root" >> $env:GITHUB_ENV
          python -m pip install -e ".[dev,geometry,headless-gui]"
          python -m pip install Pillow
      - name: Run real native save-reopen and manufacturing export
        shell: pwsh
        run: python scripts/validate_native_platform.py --diptrace-root "$env:DIPTRACE_ROOT" --output native-evidence
      - name: Run schematic acceptance, XML export, recording and hidden PCB acceptance
        shell: pwsh
        run: |
          # These tools refuse elevated tokens by design; runas /trustlevel drops the
          # runner's Administrators group in the same session and window station.
          choco install ffmpeg --version=9.0.2 -y --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg install failed' }
          $root = 'native-evidence/standard-user'
          $evidence = (New-Item -ItemType Directory -Force $root).FullName
          New-Item -ItemType Directory -Force "$root/xml-export", "$root/pcb-acceptance" | Out-Null
          $py = (Get-Command python).Source
          $paths = "$(Split-Path $py);$(Split-Path $py)\Scripts;C:\ProgramData\chocolatey\bin"
          function Invoke-StandardUser([string]$Name, [string]$Arguments, [int[]]$Allowed = @(0)) {
            $cmd = Join-Path $evidence "$Name.cmd"; $log = Join-Path $evidence "$Name.log"; $done = Join-Path $evidence "$Name.exit"
            Set-Content -Path $cmd -Encoding ascii -Value "@echo off`r`ncd /d `"$PWD`"`r`nset PATH=$paths;%PATH%`r`n`"$py`" $Arguments > `"$log`" 2>&1`r`n(echo %ERRORLEVEL%)> `"$done`""
            runas /trustlevel:0x20000 "cmd /c `"$cmd`""
            $deadline = (Get-Date).AddMinutes(6)
            while (-not (Test-Path $done) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
            if (-not (Test-Path $done)) { throw "$Name timed out" }
            $code = [int](Get-Content $done)
            if ($code -notin $Allowed) { Get-Content $log -Tail 60; throw "$Name failed with exit code $code" }
          }
          function Assert-Equal($Actual, $Expected, [string]$What) {
            if ($Actual -ne $Expected) { throw "${What}: expected '$Expected', got '$Actual'" }
          }
          Invoke-StandardUser token '-c "import ctypes, sys; sys.exit(ctypes.windll.shell32.IsUserAnAdmin())"'

          $source = 'i2c-level-shifter/i2c-level-shifter-module.dchxml'
          $sha = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          $schematic = "-B -m diptrace_mcp.schematic_native_acceptance --diptrace-root `"$env:DIPTRACE_ROOT`" --project $source --expected-sha256 $sha --erc"
          Invoke-StandardUser schematic-inspect "$schematic --output-dir $root/schematic-inspect --inspect --capture"
          Invoke-StandardUser schematic-export "$schematic --output-dir $root/schematic-export"
          foreach ($run in 'schematic-inspect', 'schematic-export') {
            $erc = Get-Content "$root/$run/erc.json" -Raw | ConvertFrom-Json
            Assert-Equal $erc.status 'no_errors_found' "$run ERC"
            Assert-Equal $erc.menu_profile 'schematic-5.3.5.1-en-Verification-285-0ba7c412' "$run ERC menu"
          }
          $steps = (Get-Content "$root/schematic-export/result.json" -Raw | ConvertFrom-Json).native_steps
          Assert-Equal (($steps | Where-Object closed).Count) 3 'closed schematic phases'
          Assert-Equal $steps[0].menu_profile 'schematic-5.3.5.1-en-File-11-0ba7c412' 'schematic Save As menu'

          Set-Content -Path "$root/empty-manifest.json" -Value '{"format":"diptrace-cinematic-v1","cues":[]}' -Encoding utf8NoBOM
          Invoke-StandardUser recording "-m diptrace_mcp.cinematic_recording headless-capture capture --diptrace-root `"$env:DIPTRACE_ROOT`" --project $((Resolve-Path $source).Path) --editor schematic --manifest $root/empty-manifest.json --video $root/recording.mp4 --window-frame --native-extents --tail 1.0"
          if (-not (Select-String -Path "$root/recording.log" -SimpleMatch '"native_view_profile": "schematic-5.3.5.1-en-zoom-extents-0ba7c412"')) { throw 'recording did not use the 5.3.5.1 Zoom Extents profile' }

          Invoke-StandardUser xml-export "-m diptrace_mcp.native_xml_export --diptrace-root `"$env:DIPTRACE_ROOT`" --project native-evidence/i2c-board/saved.dip --output-xml $root/xml-export/saved.dipxml"

          Invoke-StandardUser pcb-acceptance "-m diptrace_mcp.pcb_native_acceptance run --diptrace-root `"$env:DIPTRACE_ROOT`" --project native-evidence/i2c-board/reexport.dipxml --output-xml $root/pcb-acceptance/roundtrip.dipxml --evidence-json $root/pcb-acceptance/evidence.json --desktop hidden" -Allowed 0, 2
          $pcb = Get-Content "$root/pcb-acceptance/evidence.json" -Raw | ConvertFrom-Json
          # Exit 2 is HUMAN_REVIEW_REQUIRED: native refill recomputes pour fills and the project path changes.
          if ($pcb.verdict -eq 'FAIL' -or $pcb.drc_status -ne 'pass' -or @($pcb.structural_delta.PSObject.Properties).Count -ne 0) { throw "PCB acceptance: $($pcb.verdict) $($pcb.drc_status) $($pcb.error)" }
          "PCB acceptance verdict: $($pcb.verdict); DRC: $($pcb.drc_status)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-platform-evidence
          path: native-evidence/
          retention-days: 7
