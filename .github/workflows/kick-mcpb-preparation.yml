name: Kick MCPB preparation

on:
  push:
    branches:
      - feat/mcpb-registry-preparation
    paths:
      - ".github/workflows/kick-mcpb-preparation.yml"

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor == 'fireostendere'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Extract and execute prepared change set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/prepare-mcpb-registry.yml').read_text(encoding='utf-8')
          start = "          cat > /tmp/apply_changes.py <<'PY'\n"
          end = "\n          PY\n          python /tmp/apply_changes.py"
          payload = source.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in payload.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_changes.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_changes.py
          rm .github/workflows/prepare-mcpb-registry.yml
          rm .github/workflows/kick-mcpb-preparation.yml
          git add -A
          python scripts/audit_release_artifacts.py --write-allowlist
          git add scripts/release_artifact_allowlist.txt
          python -m pytest -q tests/test_mcpb_distribution.py
          python scripts/audit_release_artifacts.py --check-allowlist
      - name: Commit prepared changes
        shell: bash
        run: |
          git config user.name "fireostendere"
          git config user.email "87851878+fireostendere@users.noreply.github.com"
          git add -A
          git commit -s -m "feat: prepare MCPB and registry distribution"
          git push origin HEAD:feat/mcpb-registry-preparation
