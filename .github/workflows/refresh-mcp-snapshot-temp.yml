name: Refresh MCP snapshot (temporary)

on:
  push:
    branches:
      - codex/pcb-physics-reviewer

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/pcb-physics-reviewer
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Generate public MCP snapshot
        run: python scripts/generate_mcp_tools_snapshot.py
      - name: Commit refreshed snapshot
        shell: bash
        run: |
          if git diff --quiet -- reference/mcp-tools-list.snapshot.json; then
            echo 'Snapshot already current.'
            exit 0
          fi
          git config user.name 'fireostendere'
          git config user.email '87851878+fireostendere@users.noreply.github.com'
          git add reference/mcp-tools-list.snapshot.json
          git commit -m 'chore: refresh public MCP tools snapshot' -m 'Signed-off-by: fireostendere <87851878+fireostendere@users.noreply.github.com>'
          git push origin HEAD:codex/pcb-physics-reviewer
