name: Apply direct live exchange path fix

on:
  push:
    branches:
      - agent/fix-live-exchange-path

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-live-exchange-path
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply direct SessionStore patch
        run: python scripts/apply_live_exchange_path_direct_fix.py
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,geometry]"
      - name: Run focused lifecycle tests
        run: >-
          python -m pytest -q
          tests/test_cross_platform_exchange_paths.py
          tests/test_live_apply_binding.py
          tests/test_live_session_lifecycle.py
          tests/test_bridge.py
      - name: Run static checks
        run: |
          python -m ruff check --no-cache src tests
          python -m mypy --no-incremental src/diptrace_mcp plugin
          git diff --check
      - name: Commit direct implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix live exchange paths across Windows and WSL"
          git push origin HEAD:agent/fix-live-exchange-path
