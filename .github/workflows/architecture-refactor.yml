name: Architecture audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check --no-cache src/diptrace_mcp scripts tests/test_skill_packages.py
      - run: python -m mypy --no-incremental src/diptrace_mcp
      - run: python scripts/check_architecture.py
      - run: python scripts/check_release_metadata.py
      - run: python scripts/sync_skill_scripts.py --check
      - run: python scripts/check_service_facade_contract.py --check
      - run: python scripts/validate_service_decomposition.py --check
      - run: python scripts/generate_mcp_tools_snapshot.py --check
