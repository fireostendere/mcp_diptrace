name: Prepare MCPB and registry metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/prepare-mcpb-registry.yml"

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'fireostendere'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Apply post-release and MCPB preparation changes
        shell: bash
        run: |
          cat > /tmp/apply_changes.py <<'PY'
          from __future__ import annotations

          import pathlib
          import textwrap

          root = pathlib.Path.cwd()

          def write(path: str, content: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip("\n"), encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_section(path: str, start: str, end: str, replacement: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              first = text.find(start)
              last = text.find(end, first + len(start))
              if first < 0 or last < 0:
                  raise SystemExit(f"section markers not found in {path}: {start!r}, {end!r}")
              target.write_text(text[:first] + replacement + text[last:], encoding="utf-8")

          manual_signing = r'''
          name: Windows signing preparation

          on:
            workflow_dispatch:
              inputs:
                signing_required:
                  description: Require a valid Authenticode signature for packaging
                  required: true
                  default: false
                  type: boolean
                expected_signer_subject:
                  description: Expected signer subject supplied by a protected release operator
                  required: false
                  type: string

          permissions:
            contents: read

          jobs:
            build-test-package:
              name: Build, test, and package bridge
              runs-on: windows-latest
              steps:
                - name: Require a protected ref for signing
                  if: ${{ inputs.signing_required == true }}
                  shell: pwsh
                  env:
                    WORKFLOW_REF: ${{ github.ref }}
                  run: |
                    if ($env:WORKFLOW_REF -ne "refs/heads/main") {
                      throw "HUMAN ACTION REQUIRED: signing is allowed only from the protected main ref"
                    }
                - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                  with:
                    fetch-depth: 0
                    ref: ${{ github.sha }}
                - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
                  with:
                    python-version: "3.12"
                    cache: pip
                - name: Install bridge build environment
                  run: python -m pip install -e ".[dev,bridge]"
                - name: Run bridge tests
                  run: python -m pytest -q tests/test_bridge.py tests/test_plugin_settings.py
                - name: Build unsigned bridge
                  shell: pwsh
                  run: powershell -ExecutionPolicy Bypass -File .\plugin\build_bridge.ps1 -PythonCommand python -Clean
                - name: Verify build output before signing handoff
                  shell: pwsh
                  run: |
                    $path = ".\plugin\dist\diptrace_mcp_bridge.exe"
                    if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Bridge was not built" }
                    powershell -NoProfile -ExecutionPolicy Bypass -File .\plugin\verify_signature.ps1 -Path $path
                - name: Package unsigned development artifact
                  if: ${{ inputs.signing_required == false }}
                  shell: pwsh
                  run: |
                    powershell -NoProfile -ExecutionPolicy Bypass -File .\plugin\package_plugin.ps1 `
                      -BridgePath .\plugin\dist\diptrace_mcp_bridge.exe `
                      -OutputZip .\plugin\dist\diptrace_mcp_windows_plugin-unsigned.zip
                - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                  with:
                    name: diptrace-bridge-unsigned-${{ github.sha }}
                    path: plugin/dist/diptrace_mcp_bridge.exe
                    if-no-files-found: error
                - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                  if: ${{ inputs.signing_required == false }}
                  with:
                    name: diptrace-plugin-unsigned-${{ github.sha }}
                    path: plugin/dist/diptrace_mcp_windows_plugin-unsigned.zip
                    if-no-files-found: error

            protected-signing-handoff:
              name: Protected SignPath handoff
              if: ${{ inputs.signing_required == true && github.ref == 'refs/heads/main' }}
              needs: build-test-package
              runs-on: windows-latest
              environment: windows-signing
              steps:
                - name: Refuse unconfigured signing request
                  shell: pwsh
                  env:
                    SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
                    SIGNPATH_PROJECT_ID: ${{ vars.SIGNPATH_PROJECT_ID }}
                    SIGNPATH_SIGNING_POLICY_ID: ${{ vars.SIGNPATH_SIGNING_POLICY_ID }}
                    SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
                    EXPECTED_SIGNER_SUBJECT: ${{ inputs.expected_signer_subject }}
                  run: |
                    if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID) -or
                        [string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_ID) -or
                        [string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_ID) -or
                        [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -or
                        [string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER_SUBJECT)) {
                      throw "HUMAN ACTION REQUIRED: configure the protected SignPath integration before requesting signing"
                    }
                    throw "HUMAN ACTION REQUIRED: replace this reviewed handoff with the approved pinned SignPath action"
          '''
          write(".github/workflows/windows-signing.yml", manual_signing)
          trigger = root / ".release-v0.2.0.trigger"
          if trigger.exists():
              trigger.unlink()

          mcpb_workflow = r'''
          name: MCPB and registry preparation

          on:
            pull_request:
              paths:
                - ".github/workflows/mcpb.yml"
                - "packaging/mcpb/**"
                - "packaging/registry/**"
                - "scripts/build_mcpb.py"
                - "scripts/generate_registry_server_json.py"
                - "tests/test_mcpb_distribution.py"
                - "pyproject.toml"
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            metadata-contract:
              name: Validate MCPB and registry metadata
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
                  with:
                    python-version: "3.12"
                    cache: pip
                - run: python -m pip install -e ".[dev]"
                - run: python -m pytest -q tests/test_mcpb_distribution.py

            windows-bundle:
              name: Build Windows MCPB candidate
              runs-on: windows-latest
              steps:
                - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
                  with:
                    python-version: "3.12"
                    cache: pip
                - name: Build standalone server
                  shell: pwsh
                  run: .\scripts\build_windows_server.ps1 -PythonCommand python -OutputDir dist\windows-server -Clean
                - name: Build MCPB candidate
                  shell: pwsh
                  run: python scripts/build_mcpb.py --server-dir dist\windows-server\diptrace_mcp_server --output-dir dist\mcpb
                - name: Inspect candidate
                  shell: pwsh
                  run: |
                    $bundle = Get-ChildItem .\dist\mcpb\DipTrace-MCP-*-windows.mcpb | Select-Object -First 1
                    if (-not $bundle) { throw "MCPB candidate missing" }
                    python -m zipfile -t $bundle.FullName
                    python -m pytest -q tests/test_mcpb_distribution.py
                - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                  with:
                    name: diptrace-mcp-mcpb-candidate-${{ github.sha }}
                    path: |
                      dist/mcpb/*.mcpb
                      dist/mcpb/*.sha256
                    if-no-files-found: error
          '''
          write(".github/workflows/mcpb.yml", mcpb_workflow)

          manifest_template = r'''
          {
            "manifest_version": "0.3",
            "name": "diptrace-mcp",
            "display_name": "DipTrace MCP",
            "version": "__VERSION__",
            "description": "Read, review and perform guarded edits on DipTrace PCB and schematic projects through MCP.",
            "long_description": "A local Windows MCP server for DipTrace XML analysis and guarded engineering workflows. The bundle contains the standalone MCP server. Live exchange with an open DipTrace document additionally requires the DipTrace bridge plug-in from the matching GitHub release or source tree.",
            "author": {
              "name": "DipTrace MCP contributors",
              "url": "https://github.com/fireostendere/mcp_diptrace"
            },
            "repository": {
              "type": "git",
              "url": "https://github.com/fireostendere/mcp_diptrace.git"
            },
            "homepage": "https://github.com/fireostendere/mcp_diptrace",
            "documentation": "https://github.com/fireostendere/mcp_diptrace#documentation",
            "support": "https://github.com/fireostendere/mcp_diptrace/issues",
            "server": {
              "type": "binary",
              "entry_point": "server/diptrace_mcp_server.exe",
              "mcp_config": {
                "command": "${__dirname}/server/diptrace_mcp_server.exe",
                "args": [],
                "env": {
                  "DIPTRACE_MCP_WORKSPACE": "${user_config.workspace}",
                  "DIPTRACE_MCP_ALLOWED_ROOTS": "${user_config.workspace}",
                  "DIPTRACE_MCP_STATE_DIR": "${user_config.state_directory}"
                }
              }
            },
            "tools_generated": true,
            "keywords": [
              "diptrace",
              "pcb",
              "schematic",
              "eda",
              "mcp",
              "electronics"
            ],
            "license": "Apache-2.0",
            "compatibility": {
              "platforms": ["win32"]
            },
            "user_config": {
              "workspace": {
                "type": "directory",
                "title": "DipTrace workspace",
                "description": "Directory containing projects that the MCP server may read or modify.",
                "required": true
              },
              "state_directory": {
                "type": "directory",
                "title": "DipTrace MCP state directory",
                "description": "Directory for sessions, backups, logs and local records.",
                "required": true
              }
            }
          }
          '''
          write("packaging/mcpb/manifest.template.json", manifest_template)

          mcpb_readme_first = r'''
          # DipTrace MCP bundle

          This MCPB contains the self-contained Windows stdio server.

          Live exchange with a project currently open in DipTrace requires the
          matching `diptrace_mcp_bridge.exe` plug-in and settings profiles from the
          same GitHub release or source tree. Installing this MCPB alone does not
          copy files into the DipTrace installation directory.

          The server is unsigned alpha/development software. Verify release hashes,
          keep backups, use preview/dry-run flows, and treat runtime
          `get_capabilities` as authoritative for the active document.
          '''
          write("packaging/mcpb/README_FIRST.md", mcpb_readme_first)

          mcpb_readme = r'''
          # MCPB packaging

          This directory prepares a Windows MCP Bundle for a future release. It does
          not publish a release, modify an existing tag, or register the server.

          Build the standalone Windows server first, then run:

          ```powershell
          python scripts/build_mcpb.py `
            --server-dir dist\windows-server\diptrace_mcp_server `
            --output-dir dist\mcpb
          ```

          The builder reads the package version from `pyproject.toml`, writes a
          deterministic `.mcpb` ZIP archive, and creates a sibling `.sha256` file.
          The bundle is Windows-only because it contains the frozen Windows binary.

          The bundle installs the stdio server. The DipTrace executable bridge and
          settings profiles remain a separate host integration and must come from the
          same future release.
          '''
          write("packaging/mcpb/README.md", mcpb_readme)

          registry_template = r'''
          {
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.fireostendere/diptrace-mcp",
            "title": "DipTrace MCP",
            "description": "Local MCP server for reading, reviewing and performing guarded edits on DipTrace PCB and schematic projects.",
            "repository": {
              "url": "https://github.com/fireostendere/mcp_diptrace",
              "source": "github"
            },
            "version": "__VERSION__",
            "packages": [
              {
                "registryType": "mcpb",
                "identifier": "__MCPB_URL__",
                "fileSha256": "__MCPB_SHA256__",
                "transport": {
                  "type": "stdio"
                }
              }
            ]
          }
          '''
          write("packaging/registry/server.template.json", registry_template)

          build_mcpb = r'''
          #!/usr/bin/env python3
          """Build a deterministic Windows MCPB from the frozen server directory."""

          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import shutil
          import stat
          import tempfile
          import zipfile
          from pathlib import Path, PurePosixPath

          REPO_ROOT = Path(__file__).absolute().parents[1]
          TEMPLATE = REPO_ROOT / "packaging" / "mcpb" / "manifest.template.json"
          README_FIRST = REPO_ROOT / "packaging" / "mcpb" / "README_FIRST.md"
          LICENSE = REPO_ROOT / "LICENSE"
          FIXED_ZIP_TIME = (2020, 1, 1, 0, 0, 0)


          class McpbBuildError(ValueError):
              """Raised when bundle inputs or output violate the packaging contract."""


          def project_version() -> str:
              try:
                  import tomllib
              except ModuleNotFoundError:  # pragma: no cover - Python 3.10 fallback
                  import tomli as tomllib
              data = tomllib.loads((REPO_ROOT / "pyproject.toml").read_text(encoding="utf-8"))
              version = data["project"]["version"]
              if not isinstance(version, str) or not version.strip():
                  raise McpbBuildError("project.version is missing")
              return version


          def _safe_relative(root: Path, path: Path) -> PurePosixPath:
              relative = path.relative_to(root)
              if path.is_symlink() or any(part in {"", ".", ".."} for part in relative.parts):
                  raise McpbBuildError(f"unsafe bundle path: {path}")
              return PurePosixPath(relative.as_posix())


          def _manifest(version: str) -> dict[str, object]:
              data = json.loads(TEMPLATE.read_text(encoding="utf-8"))
              if data.get("version") != "__VERSION__":
                  raise McpbBuildError("manifest template version placeholder is missing")
              data["version"] = version
              return data


          def _write_zip(stage: Path, output: Path) -> None:
              output.parent.mkdir(parents=True, exist_ok=True)
              if output.exists():
                  output.unlink()
              files = sorted(path for path in stage.rglob("*") if path.is_file())
              with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
                  for path in files:
                      relative = _safe_relative(stage, path)
                      info = zipfile.ZipInfo(relative.as_posix(), FIXED_ZIP_TIME)
                      mode = 0o755 if path.suffix.lower() == ".exe" else 0o644
                      info.external_attr = (stat.S_IFREG | mode) << 16
                      info.compress_type = zipfile.ZIP_DEFLATED
                      archive.writestr(info, path.read_bytes())


          def build_bundle(server_dir: Path, output_dir: Path, version: str) -> tuple[Path, str]:
              server_dir = server_dir.resolve()
              executable = server_dir / "diptrace_mcp_server.exe"
              if not server_dir.is_dir() or not executable.is_file():
                  raise McpbBuildError(
                      "server directory must contain diptrace_mcp_server.exe: " f"{server_dir}"
                  )
              if server_dir.is_symlink():
                  raise McpbBuildError("server directory must not be a symlink")
              with tempfile.TemporaryDirectory(prefix="diptrace-mcpb-") as raw_stage:
                  stage = Path(raw_stage)
                  shutil.copytree(server_dir, stage / "server", symlinks=False)
                  (stage / "manifest.json").write_text(
                      json.dumps(_manifest(version), indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
                  shutil.copy2(README_FIRST, stage / "README_FIRST.md")
                  shutil.copy2(LICENSE, stage / "LICENSE")
                  output = output_dir.resolve() / f"DipTrace-MCP-{version}-windows.mcpb"
                  _write_zip(stage, output)
              digest = hashlib.sha256(output.read_bytes()).hexdigest()
              checksum = output.with_suffix(output.suffix + ".sha256")
              checksum.write_text(f"{digest}  {output.name}\n", encoding="utf-8")
              return output, digest


          def _parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument(
                  "--server-dir",
                  type=Path,
                  default=REPO_ROOT / "dist" / "windows-server" / "diptrace_mcp_server",
              )
              parser.add_argument(
                  "--output-dir", type=Path, default=REPO_ROOT / "dist" / "mcpb"
              )
              parser.add_argument("--version", default=None)
              return parser


          def main() -> int:
              args = _parser().parse_args()
              version = args.version or project_version()
              output, digest = build_bundle(args.server_dir, args.output_dir, version)
              print(json.dumps({"bundle": str(output), "sha256": digest}, indent=2))
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (OSError, McpbBuildError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"FAIL: {exc}") from exc
          '''
          write("scripts/build_mcpb.py", build_mcpb)

          registry_generator = r'''
          #!/usr/bin/env python3
          """Generate a concrete official MCP Registry server.json for an MCPB asset."""

          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          REPO_ROOT = Path(__file__).absolute().parents[1]
          TEMPLATE = REPO_ROOT / "packaging" / "registry" / "server.template.json"
          SHA256_RE = re.compile(r"^[0-9a-f]{64}$")


          class RegistryMetadataError(ValueError):
              """Raised when registry metadata cannot be generated safely."""


          def _replace(value: object, replacements: dict[str, str]) -> object:
              if isinstance(value, str):
                  for token, replacement in replacements.items():
                      value = value.replace(token, replacement)
                  return value
              if isinstance(value, list):
                  return [_replace(item, replacements) for item in value]
              if isinstance(value, dict):
                  return {key: _replace(item, replacements) for key, item in value.items()}
              return value


          def _sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def generate(version: str, mcpb_url: str, digest: str) -> dict[str, object]:
              parsed = urlparse(mcpb_url)
              if parsed.scheme != "https" or not parsed.netloc:
                  raise RegistryMetadataError("MCPB URL must be a public HTTPS URL")
              if "mcp" not in mcpb_url.lower():
                  raise RegistryMetadataError("MCPB URL must contain the string 'mcp'")
              digest = digest.lower()
              if not SHA256_RE.fullmatch(digest):
                  raise RegistryMetadataError("MCPB SHA-256 must be 64 lowercase hex characters")
              if not version.strip() or any(character.isspace() for character in version):
                  raise RegistryMetadataError("version must be a non-empty token")
              template = json.loads(TEMPLATE.read_text(encoding="utf-8"))
              replacements = {
                  "__VERSION__": version,
                  "__MCPB_URL__": mcpb_url,
                  "__MCPB_SHA256__": digest,
              }
              result = _replace(template, replacements)
              encoded = json.dumps(result, sort_keys=True)
              if "__" in encoded:
                  raise RegistryMetadataError("unresolved registry template placeholder")
              return result


          def _parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--version", required=True)
              parser.add_argument("--mcpb-url", required=True)
              digest = parser.add_mutually_exclusive_group(required=True)
              digest.add_argument("--mcpb-file", type=Path)
              digest.add_argument("--mcpb-sha256")
              parser.add_argument("--output", type=Path, default=Path("server.json"))
              return parser


          def main() -> int:
              args = _parser().parse_args()
              digest = _sha256(args.mcpb_file) if args.mcpb_file else args.mcpb_sha256.lower()
              result = generate(args.version, args.mcpb_url, digest)
              args.output.parent.mkdir(parents=True, exist_ok=True)
              args.output.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
              print(args.output)
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (OSError, RegistryMetadataError, json.JSONDecodeError) as exc:
                  raise SystemExit(f"FAIL: {exc}") from exc
          '''
          write("scripts/generate_registry_server_json.py", registry_generator)

          distribution_doc = r'''
          # MCP distribution preparation

          ## Current state

          GitHub prerelease `v0.2.0` is published as an explicitly unsigned
          alpha/development release. It does not contain an MCPB artifact and has not
          been submitted to the official MCP Registry or Smithery.

          This repository now prepares those channels without publishing another
          release. Existing tags and release assets must never be replaced.

          Canonical future registry name:

          ```text
          io.github.fireostendere/diptrace-mcp
          ```

          The hidden `mcp-name` marker in `README.md` uses the same value so a future
          PyPI package can also satisfy registry ownership verification. The planned
          primary route is MCPB, not PyPI.

          ## Why MCPB

          The official MCP Registry accepts MCPB files hosted in GitHub or GitLab
          releases. The `server.json` entry must contain the immutable public asset
          URL and its SHA-256. Smithery also accepts a local stdio server as an MCPB
          bundle.

          The prepared bundle is Windows-only and contains the self-contained stdio
          server. It does not silently install files into DipTrace. Live exchange
          requires the matching bridge plug-in and settings from the same future
          release.

          ## Build a candidate without publishing

          On Windows:

          ```powershell
          .\scripts\build_windows_server.ps1 `
            -PythonCommand python `
            -OutputDir dist\windows-server `
            -Clean

          python scripts/build_mcpb.py `
            --server-dir dist\windows-server\diptrace_mcp_server `
            --output-dir dist\mcpb
          ```

          Outputs:

          ```text
          dist/mcpb/DipTrace-MCP-<version>-windows.mcpb
          dist/mcpb/DipTrace-MCP-<version>-windows.mcpb.sha256
          ```

          CI performs the same build and uploads an Actions artifact only. It does
          not create a tag, GitHub Release, registry entry, or Smithery listing.

          ## Future official MCP Registry publication

          Only after a new reviewed version is released:

          1. Upload the exact `.mcpb` file as an immutable GitHub Release asset.
          2. Download the public file again and verify its SHA-256.
          3. Generate concrete metadata:

             ```bash
             python scripts/generate_registry_server_json.py \
               --version <version> \
               --mcpb-url https://github.com/fireostendere/mcp_diptrace/releases/download/v<version>/DipTrace-MCP-<version>-windows.mcpb \
               --mcpb-file DipTrace-MCP-<version>-windows.mcpb \
               --output server.json
             ```

          4. Validate the generated file with the current official schema and
             `mcp-publisher` version.
          5. Authenticate using `mcp-publisher login github`.
          6. Run `mcp-publisher publish`.
          7. Query the registry API and record the immutable published metadata.

          The official registry is in preview. Re-check its current schema and
          package requirements at publication time.

          ## Future Smithery publication

          After the same MCPB has been publicly released and verified:

          ```bash
          smithery auth login
          smithery mcp publish ./DipTrace-MCP-<version>-windows.mcpb \
            -n fireostendere/diptrace-mcp
          ```

          Record the Smithery release identifier and confirm that installation asks
          for workspace and state directories. Do not describe the MCPB as installing
          the DipTrace bridge automatically.

          ## awesome-mcp-servers entry

          The repository is already suitable for a listing under Developer Tools:

          ```markdown
