name: Publish GitHub release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "release.json"
      - "scripts/release_artifact_allowlist.txt"
      - "tests/test_ci_workflow.py"
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated release tag, for example v0.5.0
        required: true
        type: string
      windows_run_id:
        description: Successful Windows one-click installer workflow run built from the tag target
        required: true
        type: string
      prerelease:
        description: Publish the GitHub release as a prerelease
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate reusable release workflow
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify no version-specific publication workflow is required
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/release.yml
          test -f .github/workflows/pypi.yml

  verify-published:
    name: Public redownload and PyPI smoke
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download public GitHub assets and verify recorded digests
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p public-release
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          root = pathlib.Path('.')
          release = json.loads((root / 'release.json').read_text(encoding='utf-8'))
          if not str(release.get('release_status', '')).startswith('published-'):
              raise SystemExit('release.json is not in a published state')
          tag = release['tag']
          repository = os.environ['REPOSITORY']
          output = root / 'public-release'
          output.mkdir(exist_ok=True)

          for name, expected in release['assets'].items():
              url = f'https://github.com/{repository}/releases/download/{tag}/{name}'
              request = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'diptrace-mcp-release-verifier'},
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{name}: public SHA-256 {actual} != recorded {expected}')
              (output / name).write_bytes(data)
              print(f'OK {name} {actual}')

          manifest = (output / 'SHA256SUMS.txt').read_text(encoding='utf-8-sig')
          entries = {}
          for line in manifest.splitlines():
              if not line.strip():
                  continue
              digest, filename = line.split(None, 1)
              entries[pathlib.Path(filename.strip()).name] = digest.lower()
          for name, expected in release['assets'].items():
              if name == 'SHA256SUMS.txt':
                  continue
              if entries.get(name) != expected:
                  raise SystemExit(
                      f'{name}: public checksum manifest is inconsistent with release.json'
                  )
          PY
      - name: Verify public PyPI JSON identity and digests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import urllib.request

          release = json.loads(pathlib.Path('release.json').read_text(encoding='utf-8'))
          project = release['pypi_project']
          version = release['version']
          url = f'https://pypi.org/pypi/{project}/{version}/json'
          request = urllib.request.Request(
              url,
              headers={'User-Agent': 'diptrace-mcp-release-verifier'},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              metadata = json.load(response)
          if metadata['info']['version'] != version:
              raise SystemExit('PyPI JSON version does not match release.json')
          public = {item['filename']: item['digests']['sha256'] for item in metadata['urls']}
          for name, expected in release['pypi_artifacts'].items():
              actual = public.get(name)
              if actual != expected:
                  raise SystemExit(f'{name}: PyPI SHA-256 {actual} != recorded {expected}')
              print(f'OK {name} {actual}')
          PY
      - name: Clean-install the published PyPI package
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["version"])')"
          python -m venv public-pypi-venv
          public-pypi-venv/bin/python -m pip install --no-cache-dir --index-url https://pypi.org/simple "diptrace-mcp==${version}"
          public-pypi-venv/bin/diptrace-mcp --help
          public-pypi-venv/bin/python -c "import diptrace_mcp; assert diptrace_mcp.__version__ == '${version}'"

  publish:
    name: Publish immutable GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Verify tag, project version, and Windows artifact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          PY
          )"
          expected_tag="v${version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match project version ${expected_tag}." >&2
            exit 1
          fi

          git fetch --tags --force
          test "$(git cat-file -t "${RELEASE_TAG}")" = tag
          tag_target="$(git rev-list -n 1 "${RELEASE_TAG}")"
          test "${tag_target}" = "$(git rev-parse HEAD)"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WINDOWS_RUN_ID}")"
          run_sha="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<<"${run_json}")"
          run_name="$(python -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<<"${run_json}")"
          run_conclusion="$(python -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])' <<<"${run_json}")"
          test "${run_name}" = "Windows one-click installer"
          test "${run_conclusion}" = "success"
          if [[ "${run_sha}" != "${tag_target}" ]]; then
            echo "Windows run ${WINDOWS_RUN_ID} was built from ${run_sha}, not tag target ${tag_target}." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Download validated Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: diptrace-windows-artifacts
          path: release/windows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.windows_run_id }}
      - name: Verify release payload and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          sums="release/windows/SHA256SUMS.txt"
          portable="release/windows/portable/DipTrace-MCP-Portable-${RELEASE_VERSION}.zip"
          setup="$(find release/windows/installer -maxdepth 1 -type f -name "DipTrace-MCP-Setup-${RELEASE_VERSION}*.exe" ! -name '*Plugin*' -print -quit)"
          plugin="$(find release/windows/installer -maxdepth 1 -type f -name "DipTrace-MCP-Plugin-Setup-${RELEASE_VERSION}*.exe" -print -quit)"
          test -f "${sums}"
          test -f "${portable}"
          test -n "${setup}"
          test -n "${plugin}"
          python - "${sums}" "${setup}" "${plugin}" "${portable}" <<'PY'
          import hashlib
          import pathlib
          import sys

          sums_path = pathlib.Path(sys.argv[1])
          expected = {}
          for line in sums_path.read_text(encoding='utf-8-sig').splitlines():
              if not line.strip():
                  continue
              digest, name = line.split(None, 1)
              expected[name.strip()] = digest.lower()
          for raw in sys.argv[2:]:
              path = pathlib.Path(raw)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              wanted = expected.get(path.name)
              if wanted != actual:
                  raise SystemExit(f'{path.name}: {actual} != {wanted}')
          PY
      - name: Publish new GitHub release without replacing existing bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to replace published bytes." >&2
            exit 1
          fi
          args=(
            release create "${RELEASE_TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --title "DipTrace MCP ${RELEASE_TAG}"
            --generate-notes
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" \
            release/windows/SHA256SUMS.txt \
            release/windows/installer/*.exe \
            release/windows/portable/*.zip
