name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-linux:
    name: test-linux (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=long 2>&1 | tee pytest-${{ matrix.python }}.log
      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-linux-${{ matrix.python }}
          path: pytest-${{ matrix.python }}.log

  test-linux-geometry-and-coverage:
    name: test-linux geometry + coverage (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,geometry]"
      - name: Configure portable coverage paths
        shell: bash
        run: |
          printf '[run]\nrelative_files = true\nsource = src/diptrace_mcp\n' > .coveragerc
      - name: Prove exact GEOS geometry is active
        run: python scripts/verify_geometry_backend.py --expect shapely_geos
      - name: Run real headless bridge handshake
        run: python scripts/smoke_bridge_headless.py
      - name: Run full tests with Linux coverage gates
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=long \
            --cov=src/diptrace_mcp \
            --cov-report=term \
            --cov-report=json:coverage.json \
            --cov-fail-under=85 \
            2>&1 | tee pytest-3.12-geometry.log
          python scripts/check_coverage.py coverage.json
          mv .coverage .coverage.linux-geometry
      - name: Upload Linux geometry coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-linux-geometry
          include-hidden-files: true
          path: .coverage.linux-geometry
      - name: Upload failed test and coverage reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-linux-3.12-geometry
          path: |
            pytest-3.12-geometry.log
            coverage.json

  test-linux-no-shapely-fallback:
    name: test-linux no-Shapely fallback (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Configure portable coverage paths
        shell: bash
        run: |
          printf '[run]\nrelative_files = true\nsource = src/diptrace_mcp\n' > .coveragerc
      - name: Ensure Shapely is absent
        run: |
          python -m pip uninstall -y shapely
          python -c "import importlib.util; assert importlib.util.find_spec('shapely') is None"
      - name: Exercise the real pure-Python fallback
        run: python scripts/verify_geometry_backend.py --expect pure_python
      - name: Run fallback-focused regression tests with coverage
        run: >-
          python -m pytest -q
          --cov=src/diptrace_mcp
          --cov-report=
          tests/test_geometry.py
          tests/test_copper_pour_obstacles.py
      - run: mv .coverage .coverage.linux-fallback
      - name: Upload Linux fallback coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-linux-fallback
          include-hidden-files: true
          path: .coverage.linux-fallback

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check --no-cache src tests benchmarks scripts plugin
      - run: python -m mypy --no-incremental src/diptrace_mcp plugin
      - run: python scripts/check_release_metadata.py
      - run: python scripts/sync_skill_scripts.py --check
      - run: python scripts/generate_pcb_skills.py --check
      - run: python scripts/check_public_privacy.py
      - run: python scripts/check_provenance_inventory.py
      - run: python scripts/generate_compliance_inventory.py --check
      - run: python scripts/audit_event_loop.py --json
      - run: python scripts/generate_coverage_badge.py --check
      - name: Verify event-loop responsiveness and README badges
        run: python -m pytest -q tests/test_event_loop_responsiveness.py tests/test_badges.py
      - name: Verify consolidated skill delivery
        run: python -m pytest -q tests/test_skill_packages.py
      - name: Enforce MCP discovery budget
        run: >-
          python scripts/measure_mcp_surface.py
          --baseline-bytes 121335
          --max-growth-percent 15
      - name: Freeze the complete public tools/list contract
        run: python scripts/generate_mcp_tools_snapshot.py --check
      - name: Build and audit public release artifacts
        run: |
          python -m hatchling build -d release-dist
          python scripts/audit_release_artifacts.py --dist-dir release-dist --check-allowlist
      - run: >-
          python scripts/extract_spec_inventory.py
          --sources tests/fixtures
          --out reference/diptrace-xml/spec_inventory.json
          --check
      - run: python scripts/report_format_coverage.py --check
      - run: python scripts/make_probe_pack.py --check
      - name: Exercise trust-neutral fixture ingest dry-run
        run: python scripts/ingest_fixtures.py --dry-run --synthetic --json
      - name: Audit acceptance seeds without granting trust
        run: python scripts/audit_acceptance_seeds.py

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Configure portable coverage paths
        shell: bash
        run: |
          printf '[run]\nrelative_files = true\nsource = src/diptrace_mcp\n' > .coveragerc
      - run: python -m pytest -q --cov=src/diptrace_mcp --cov-report=
      - run: mv .coverage .coverage.macos
      - name: Upload macOS coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-macos
          include-hidden-files: true
          path: .coverage.macos
      - run: diptrace-mcp --help
      - name: Run real headless bridge handshake
        run: python scripts/smoke_bridge_headless.py

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Configure portable coverage paths
        shell: pwsh
        run: |
          @"
          [run]
          relative_files = true
          source = src/diptrace_mcp
          "@ | Set-Content -Encoding ascii .coveragerc
      - run: python -m pytest -q --cov=src/diptrace_mcp --cov-report=
      - shell: pwsh
        run: Move-Item .coverage .coverage.windows
      - name: Upload Windows coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-windows
          include-hidden-files: true
          path: .coverage.windows
      - run: diptrace-mcp --help
      - name: Run real headless bridge handshake
        run: python scripts/smoke_bridge_headless.py

  combined-coverage:
    name: combined supported-environment coverage
    runs-on: ubuntu-latest
    needs:
      - test-linux-geometry-and-coverage
      - test-linux-no-shapely-fallback
      - test-macos
      - test-windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Configure portable coverage paths
        shell: bash
        run: |
          printf '[run]\nrelative_files = true\nsource = src/diptrace_mcp\n' > .coveragerc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Combine supported-environment coverage
        shell: bash
        run: |
          coverage combine coverage-data
          coverage report --fail-under=90
          coverage json -o coverage-combined.json
          python scripts/check_coverage.py coverage-combined.json
      - name: Upload combined coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-combined
          path: coverage-combined.json

  build-windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build unsigned bridge
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\plugin\build_bridge.ps1 -PythonCommand python -Clean
      - name: Verify bridge executable
        shell: pwsh
        run: |
          $path = ".\plugin\dist\diptrace_mcp_bridge.exe"
          if (-not (Test-Path $path)) { throw "Bridge executable was not created" }
          if ((Get-Item $path).Length -le 0) { throw "Bridge executable is empty" }
      - name: Smoke-run bridge executable
        shell: pwsh
        run: |
          & ".\plugin\dist\diptrace_mcp_bridge.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Bridge executable failed to start (missing bundled modules?)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diptrace-bridge-ci-unsigned
          path: plugin/dist/diptrace_mcp_bridge.exe

  dco:
    name: DCO
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_dco.py --base "$BASE_SHA" --head "$HEAD_SHA"
