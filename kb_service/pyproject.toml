[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-base-rag"
version = "0.1.0"
description = "Local engineering knowledge RAG service: Qdrant + FastEmbed + BM25 hybrid search, MCP server for OpenCode"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.12,<2.0",
    "fastembed==0.5.1",
    "mcp>=1.10,<2",
    "pypdf>=4.3",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
youtube = [
    "youtube-transcript-api>=1.0",
    "yt-dlp>=2024.10.22",
]
dev = [
    "pytest>=8.0",
    "fpdf2>=2.7",
]

[project.scripts]
knowledge = "knowledge_base.cli:main"
knowledge-mcp = "knowledge_base.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_base"]

[tool.pytest.ini_options]
testpaths = ["tests"]
